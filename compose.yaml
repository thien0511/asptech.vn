services:
  app:
    image: asptech-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://asptech:${POSTGRES_PASSWORD:-change-me}@postgres:5432/asptech?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:-generate-a-long-random-secret}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      SEED_TEST_PASSWORD: ${SEED_TEST_PASSWORD:-change-this-seed-password}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports: ["${APP_PORT:-3001}:3000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asptech
      POSTGRES_USER: asptech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asptech -d asptech"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asptech}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-password}
    volumes: ["minio_data:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
volumes:
  postgres_data:
  minio_data:
